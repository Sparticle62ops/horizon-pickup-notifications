name: swap-release-asset

on:
  push:
    branches: [main]
    paths: ['.github/workflows/swap-asset.yml']

permissions:
  contents: write

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and verify upstream LICENSE
        run: |
          set -e
          curl -fsSL https://raw.githubusercontent.com/Roundaround/mc-fabric-pickup-notifications/main/LICENSE -o LICENSE
          GOT=$(sha256sum LICENSE | cut -d' ' -f1)
          if [ "$GOT" != "0eb29e7bfe4099e6c944dc34de7c94baedaa0e03957b01825b9c801a42c95fb7" ]; then
            echo "LICENSE sha mismatch: $GOT"
            exit 1
          fi

      - name: Package and verify the .hmod
        run: |
          set -e
          python3 - <<'PY'
          import zipfile
          members = ['Cargo.toml','LICENSE','README.md','horizon-mod.toml','assets/pickupnotifications/lang/en_us.json','src/lib.rs','src/core.rs']
          with zipfile.ZipFile('pickup_notifications-1.0.0.hmod','w') as z:
              for m in members:
                  zi = zipfile.ZipInfo(m, date_time=(2026,11,21,0,0,0))
                  zi.compress_type = zipfile.ZIP_DEFLATED
                  zi.external_attr = 0o644 << 16
                  z.writestr(zi, open(m,'rb').read())
          PY
          GOT=$(sha256sum pickup_notifications-1.0.0.hmod | cut -d' ' -f1)
          echo "package sha256: $GOT"
          if [ "$GOT" != "08cc82e5dbbd3eaaeacd67bb3d909c193e3189ff11c3eeecda35e995fffb3b7c" ]; then
            echo "package sha mismatch"
            exit 1
          fi

      - name: Replace release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release upload v1.0.0 pickup_notifications-1.0.0.hmod --clobber
          gh release delete-asset v1.0.0 pickup_notifications-1.0.0.hnmod --yes

      - name: Remove this workflow
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/swap-asset.yml
          git add LICENSE
          git commit -m "Add MIT LICENSE from upstream; remove temporary release-asset workflow; package drops the generated Cargo.lock (cargo regenerates it)"
          git push origin HEAD:main
